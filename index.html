<title>Central do FER</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23221C46%27/%3E%3Cpolygon points=%276,6 12.6,6 26,26 19.4,26%27 fill=%27%2300EB5E%27/%3E%3Cpolygon points=%2719.4,6 26,6 12.6,26 6,26%27 fill=%27%2300EB5E%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app shell — fixed left rail (operacional / estratégico), working canvas on the right, editing in a right-hand drawer. Brand palette from Pluxee, used sparingly on a cool light ground. */
:root{
  --navy:#221C46; --green:#00EB5E; --blue:#17CCF9; --yellow:#FFDC37; --coral:#FF7375;
  --bg:#F5F5FA; --surface:#FFFFFF; --surface-2:#F0F0F7; --surface-3:#E8E7F2; --line:#E2E1EC; --line-2:#D3D1E2;
  --ink:#1C1838; --ink-2:#55516F; --ink-3:#8A87A2;
  --primary:#221C46; --on-primary:#FFFFFF; --focus:#17A8D4;
  --ok:#0E8F49; --ok-bg:#E3F8EC; --warn:#A86A00; --warn-bg:#FFF4CC; --crit:#C93A45; --crit-bg:#FFE7E8; --info:#0F7FA6; --info-bg:#E0F6FD; --mute-bg:#EEEDF4;
  --q-crise:#FF7375; --q-tec:#F2C200; --q-rel:#17CCF9; --q-baixo:#00C24E; --q-zona:#9C98B5;
  --shadow:0 1px 2px rgba(34,28,70,.06),0 8px 24px rgba(34,28,70,.06);
  --shadow-lg:0 20px 60px rgba(34,28,70,.18);
  --f-display:"TT Travels","TT Travels Next","Sora","Manrope",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#110F1E; --surface:#19162C; --surface-2:#211D38; --surface-3:#2A2546; --line:#2C2847; --line-2:#3A3559;
  --ink:#EEEDF7; --ink-2:#B1AECB; --ink-3:#7F7B9C;
  --primary:#00EB5E; --on-primary:#141030; --focus:#17CCF9;
  --ok:#3EE58A; --ok-bg:#103424; --warn:#FFD24A; --warn-bg:#3A3110; --crit:#FF8A92; --crit-bg:#3E1A23; --info:#6FDCFB; --info-bg:#0F3140; --mute-bg:#26223F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadow-lg:0 20px 60px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110F1E; --surface:#19162C; --surface-2:#211D38; --surface-3:#2A2546; --line:#2C2847; --line-2:#3A3559;
  --ink:#EEEDF7; --ink-2:#B1AECB; --ink-3:#7F7B9C;
  --primary:#00EB5E; --on-primary:#141030; --focus:#17CCF9;
  --ok:#3EE58A; --ok-bg:#103424; --warn:#FFD24A; --warn-bg:#3A3110; --crit:#FF8A92; --crit-bg:#3E1A23; --info:#6FDCFB; --info-bg:#0F3140; --mute-bg:#26223F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadow-lg:0 20px 60px rgba(0,0,0,.5);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num,td.n,.tab{font-variant-numeric:tabular-nums}

/* ── shell ── */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px 16px;gap:22px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.mark{width:34px;height:34px;background:var(--navy);display:grid;place-items:center;clip-path:polygon(0 0,72% 0,100% 28%,100% 100%,0 100%);border-radius:6px 0 6px 6px}
.mark svg{width:18px;height:18px}
.brand b{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{color:var(--ink-3);font-size:11.5px;font-weight:600}
.navgrp{display:flex;flex-direction:column;gap:2px}
.navgrp>span{font-size:10.5px;font-weight:800;letter-spacing:.09em;color:var(--ink-3);text-transform:uppercase;padding:0 10px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:13.5px}
.nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav.on{background:var(--surface-2);color:var(--ink)}
.nav.on svg{stroke:var(--ink)}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:800;background:var(--crit-bg);color:var(--crit);padding:1px 7px;border-radius:99px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 6px}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)}

.main{min-width:0;padding-block:24px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.page{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.head h1 span{display:block;font-weight:500;color:var(--ink-3);font-size:18px;letter-spacing:-.01em}
.head-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ── controls ── */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;line-height:1.2}
.btn:hover{background:var(--surface-2)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.pri{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.pri:hover{filter:brightness(1.12)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--crit)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:13.5px;min-width:0}
textarea.inp{resize:vertical;min-height:72px;line-height:1.45}
.inp:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
.search{position:relative;min-width:0}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:2}
.search .inp{padding-left:32px;width:240px;max-width:100%}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select.inp{width:auto;max-width:220px;padding:7px 28px 7px 10px}

/* ── surfaces ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 18px 6px;flex-wrap:wrap}
.card-h h2{margin:0;font-family:var(--f-display);font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.card-h p{margin:2px 0 0;color:var(--ink-3);font-size:12.5px;max-width:70ch}
.card-b{padding:12px 18px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1fr) 340px}
.sec-t{display:flex;align-items:center;gap:10px;margin:6px 0 -4px}
.sec-t h2{margin:0;font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.sec-t .q{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:-.01em;color:var(--ink);text-transform:none}
.sec-t i{flex:1;height:1px;background:var(--line)}

/* KPI tiles — snipped corner like the brand blocks */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 15px;position:relative;min-width:0}
.kpi.snip{clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
.kpi .l{font-size:12px;font-weight:700;color:var(--ink-2)}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.02em;line-height:1.1;margin-top:6px}
.kpi .s{font-size:12px;color:var(--ink-3);margin-top:4px;font-weight:600}
.kpi.k-crit{background:var(--crit-bg);border-color:transparent} .kpi.k-crit .v{color:var(--crit)}
.kpi.k-navy{background:var(--navy);border-color:transparent;color:#fff} .kpi.k-navy .l{color:#C9C5E8} .kpi.k-navy .s{color:#A9A4D4}
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--green)}

/* ── tables ── */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:none}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover td{background:var(--surface-2)}
.t td.n,.t th.n{text-align:right;white-space:nowrap}
.t .nm{font-weight:700;color:var(--ink)}
.t .sub{color:var(--ink-3);font-size:12px}
.t td.wrap{min-width:220px;max-width:360px}
.t tr.child td{background:var(--surface-2)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* pills & chips */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--mute-bg);color:var(--ink-2);line-height:1.6}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill.plain::before{display:none}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-crit{background:var(--crit-bg);color:var(--crit)} .p-info{background:var(--info-bg);color:var(--info)}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.tag.t-cro{background:color-mix(in srgb,var(--blue) 20%,transparent);color:var(--info)}
.tag.t-ent{background:color-mix(in srgb,var(--navy) 14%,transparent);color:var(--ink)}
.tag.t-ret{background:color-mix(in srgb,var(--coral) 22%,transparent);color:var(--crit)}
.tag.t-pla{background:color-mix(in srgb,var(--yellow) 35%,transparent);color:var(--warn)}
.tag.t-aca{background:color-mix(in srgb,var(--green) 22%,transparent);color:var(--ok)}
.q-dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--crit-bg);color:var(--crit)}

/* ── tasks (Hoje) ── */
.summary{display:flex;gap:10px;flex-wrap:wrap}
.sum{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:150px}
.sum b{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1}
.sum span{font-size:12px;color:var(--ink-2);font-weight:700;line-height:1.25}
.sum.crit b{color:var(--crit)} .sum.warn b{color:var(--warn)}
.bucket{display:flex;flex-direction:column}
.bucket-h{display:flex;align-items:center;gap:10px;padding:14px 18px 8px;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.bucket-h em{font-style:normal;color:var(--ink-3);font-weight:700}
.task{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:14px;padding:12px 18px 12px 0;border-top:1px solid var(--line);align-items:center}
.task .sv{align-self:stretch;border-radius:0 3px 3px 0;background:var(--line-2)}
.task.crit .sv{background:var(--crit)} .task.warn .sv{background:var(--yellow)} .task.info .sv{background:var(--blue)}
.task-t{font-weight:700;color:var(--ink);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.task-c{color:var(--ink-2);font-size:12.5px;margin-top:2px}
.task-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.due{font-size:12px;font-weight:800;white-space:nowrap}
.due.crit{color:var(--crit)} .due.warn{color:var(--warn)} .due.mute{color:var(--ink-3)}
.task-a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.more{padding:10px 18px;color:var(--ink-3);font-size:12.5px;font-weight:700;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;width:100%}
.more:hover{color:var(--ink)}
.queue li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.queue li:first-child{border-top:0}
.queue ol{list-style:none;margin:0;padding:0}
.queue .rk{font-family:var(--f-display);font-weight:700;color:var(--ink-3);width:26px;font-size:12px}

/* ── funnel strip ── */
.funnel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) repeat(4,minmax(0,.75fr));gap:8px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;min-width:0}
.stage:hover{border-color:var(--line-2)}
.stage.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.stage .sl{font-size:11px;font-weight:800;color:var(--ink-3);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .sv2{font-family:var(--f-display);font-size:22px;font-weight:700;margin-top:2px}
.stage .sb{font-size:11.5px;color:var(--ink-3);font-weight:600}
.stage .st{height:4px;border-radius:99px;margin-top:8px;background:var(--surface-3);overflow:hidden}
.stage .st i{display:block;height:100%}

/* ── exec ── */
.quad-wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
.quad svg{width:100%;height:auto;display:block}
.heat td.h{text-align:center;font-weight:800;font-variant-numeric:tabular-nums;min-width:56px}
.insight{padding:12px 14px;border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.insight p{margin:0;font-weight:600}
.reading{white-space:pre-wrap;font-size:13.5px;line-height:1.6;background:var(--surface-2);border-radius:10px;padding:14px 16px}
.hbar{display:flex;align-items:center;gap:8px}
.hbar i{height:8px;border-radius:99px;background:var(--navy);display:block;min-width:2px}
:root[data-theme="dark"] .hbar i{background:var(--blue)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hbar i{background:var(--blue)}}

/* ── drawer ── */
.scrim{position:fixed;inset:0;background:rgba(17,14,36,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .22s ease}
.drawer.on{transform:none}
.dr-h{padding:calc(18px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) 14px 22px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dr-h .ey{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.dr-h h3{margin:2px 0 0;font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.dr-h .x{margin-left:auto}
.dr-b{flex:1;overflow:auto;padding:18px max(22px,env(safe-area-inset-right,0px)) 28px 22px;display:flex;flex-direction:column;gap:18px}
.dr-f{padding:12px max(22px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) 22px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dr-f .sp{flex:1}
.fs{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;margin:0;min-width:0}
.fs legend{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding:0 6px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fg.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:12px;font-weight:700;color:var(--ink-2)}
.f .hint{font-size:11.5px;color:var(--ink-3)}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;background:var(--surface-2);border-radius:12px;padding:12px 14px}
.calc div{display:flex;flex-direction:column;gap:3px;min-width:0}
.calc small{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.calc b{font-size:13.5px}
.mx{display:grid;grid-template-columns:minmax(130px,1fr) auto;gap:6px 12px;align-items:center}
.mx .tn{font-weight:600;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:4px 9px;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--ink-3);border-left:1px solid var(--line)}
.seg label:first-of-type{border-left:0}
.seg input:checked+label{color:var(--ink);background:var(--surface-3)}
.seg input:checked+label.v-Negativo{background:var(--crit-bg);color:var(--crit)}
.seg input:checked+label.v-Oportunidade{background:var(--warn-bg);color:var(--warn)}
.seg input:checked+label.v-Positivo{background:var(--ok-bg);color:var(--ok)}
.seg input:focus-visible+label{outline:2px solid var(--focus);outline-offset:-2px}
.list-mini{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.list-mini .row{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-top:1px solid var(--line);font-size:13px}
.list-mini .row:first-child{border-top:0}
.list-mini .row .d{color:var(--ink-3);font-weight:700;white-space:nowrap;font-size:12px;min-width:62px}
.acts{display:flex;flex-direction:column;gap:10px}
.act{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,1fr) 130px 140px auto;gap:8px;align-items:end}
.act .f label{font-size:11px}
.prop{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.prop-h{display:flex;gap:10px;align-items:center}

function fullTimeline(cd){const U=[];const k=S.clientes['cd-'+cd];const es=list('entrevistas').filter(e=>String(e.cd)===String(cd));
 const push=(arr,pre)=>arr.forEach(u=>U.push({...u,pre:u.pre||pre}));
 if(k)push(updatesFor('clientes',k._id),'Cronograma');
 for(const e of es){const own=[];const sc=(k,x)=>({c:'entrevistas',id:e._id,k,...x});(e.log||[]).forEach((l,i)=>own.push({data:l.data,texto:l.texto,src:sc('log',{i})}));
  if(e.retornoEnviadoEm&&!(e.log||[]).some(l=>/retorno|devolutiva|falei com o cliente/i.test(l.texto)))own.push({data:e.retornoEnviadoEm,texto:'Devolutiva enviada ao cliente',src:sc('ret',{})});
  if(e.data)own.push({data:e.data,texto:`Entrevista FER realizada${e.entrevistado?' com '+e.entrevistado+(e.cargo?' ('+e.cargo+')':''):''} · nota ${e.nota??'–'} · ${e.quadrante||'sem quadrante'}`,src:sc('entdata',{})});
  POS.filter(p=>p.f&&e[p.f]&&e[p.f]!=='feito').forEach(p=>{if(!(e.log||[]).some(l=>l.data===e[p.f]&&l.texto.includes(`Passo ${p.n}`)))own.push({data:e[p.f],texto:`Passo ${p.n} feito: ${p.t}`,src:sc('pos',{f:p.f})})});
  push(own,'Entrevista');
  list('temas').filter(t=>t.entrevistaId===e._id).forEach(t=>{const L=[];temaLog(t,(d,x,sr,pr)=>L.push({data:d,texto:pr?pr+': '+x:x,src:sr}));push(L,t.resumo||t.tema)})}
 const seen=new Set();return U.filter(u=>{const kk=u.data+'|'+u.texto;if(seen.has(kk))return false;seen.add(kk);return true}).sort((a,b)=>String(b.data||'0').localeCompare(String(a.data||'0')))}

 return [...cds].map(cd=>{const k=S.clientes['cd-'+cd];const e=list('entrevistas').find(x=>String(x.cd)===cd);const tl=fullTimeline(cd);const step=e?entStep(e):(k?({'1.':1,'2.':2,'3.':2,'4.':3,'5.':4}[(k.etapa||'').slice(0,2)]||null):null);
  return {cd,nome:short(k?k.nome:e.cliente),bv:k?k.bv:e.bv,e,k,n:tl.length,last:(tl.find(u=>u.data)||{}).data||'',step,fora:k&&['Stand by','Adiou','Recusou','LOST / fora do escopo'].includes(k.etapa)?k.etapa:''}}).sort((a,b)=>String(b.last).localeCompare(String(a.last)))}

 <div style="display:flex;justify-content:flex-end;margin:-4px 0 8px"><button class="btn sm ghost" data-a="exTemaAll">${exOpen.size>=trs.length?'Fechar todos':'Abrir todos os temas'}</button></div>

 ${trs.map(x=>{const op=exOpen.has(x.t);return `<tr class="click" data-a="exTema" data-v="${esc(x.t)}"><td class="nm"><span class="ex-chev" style="transform:rotate(${op?90:0}deg)">${ICON.chev}</span>${esc(x.t)}</td>${cell(x.o.Negativo,'var(--crit)')}${cell(x.o.Oportunidade,'var(--q-tec)')}${cell(x.o.Neutro,'var(--ink-3)')}${cell(x.o.Positivo,'var(--q-baixo)')}<td>${x.neg>=2?`<span class="pill p-crit">Dor · ${x.neg} clientes</span>`:x.op>=2?`<span class="pill p-warn">Oportunidade · ${x.op} clientes</span>`:`<span class="muted">${x.neg?'1 cliente (dor)':'–'}</span>`}</td><td class="n">${x.neg?brl(x.bv):'–'}</td><td class="sub">${dq[x.t]?Object.entries(dq[x.t]).map(([q,n])=>`${esc(q)} (${n})`).join(', '):'–'}</td></tr>${op?exDet(x):''}`}).join('')||`<tr><td colspan="8"><div class="empty">Sem temas avaliados.</div></td></tr>`}
 </tbody></table></div></section>

 const prompt=`Você apoia o time de Client Retention da Pluxee (benefícios) no Fresh Eyes Review (FER): entrevistas de percepção com grandes clientes.
Leia a transcrição ou o relatório abaixo e devolva SOMENTE um objeto JSON com o formato indicado. Regras:
- Não invente. Se uma informação não estiver no texto, use null (ou omita o tema).
- Datas no formato AAAA-MM-DD. BV em reais (ex.: "R$ 45 MI" = 45000000). Fim do contrato = último dia do mês informado.
- Notas de 0 a 10. "tecnico" = gravidade dos problemas técnicos/operacionais percebidos; "relacionamento" = gravidade dos problemas de relacionamento/atenção. Quadrante Tenacity (corte ${c.limiar}): técnico alto + relacionamento alto = "Crise"; técnico alto + relacionamento baixo = "Assistência Técnica"; técnico baixo + relacionamento alto = "Assessoria"; ambos baixos = "Risco Baixo"; use "Zona" só se o texto falar de fatores externos que podem mudar o status de repente. Se o relatório já trouxer as notas e o quadrante, use os do relatório.

async function docxText(buf){

 for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){eo=i;break}}
 if(eo<0)throw new Error('zip inválido');
 const cnt=dv.getUint16(eo+10,true);let p=dv.getUint32(eo+16,true);const dec=new TextDecoder();let ent=null;
 for(let k=0;k<cnt;k++){const meth=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);const name=dec.decode(u8.subarray(p+46,p+46+nl));if(name==='word/document.xml'){ent={meth,csz,lo};break}p+=46+nl+xl+cl}
 if(!ent)throw new Error('sem document.xml');
 const lp=ent.lo,start=lp+30+dv.getUint16(lp+26,true)+dv.getUint16(lp+28,true);const data=u8.subarray(start,start+ent.csz);
 let xml;if(ent.meth===0)xml=dec.decode(data);else{const ds=new DecompressionStream('deflate-raw');const out=await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer();xml=dec.decode(out)}
 const doc=new DOMParser().parseFromString(xml,'application/xml');const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
 const lines=[];
 for(const para of doc.getElementsByTagNameNS(W,'p')){let t='';const walk=n=>{for(const c of n.childNodes){if(c.nodeType!==1)continue;const ln=c.localName;if(ln==='t')t+=c.textContent;else if(ln==='tab')t+='\t';else if(ln==='br'||ln==='cr')t+='\n';else if(ln!=='p')walk(c)}};walk(para);lines.push(t)}
 return lines.join('\n').replace(/\n{3,}/g,'\n\n');
}
